<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#F5F6F8;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5F6F8;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
          <tr>
            <td align="center" style="padding:40px 32px 12px;">
              <img src="https://muuqwear.com/apple-touch-icon.png" width="56" height="56" alt="MuuqWear" style="display:block;border:0;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#1E2A47;font-size:24px;font-weight:700;">
              Confirm your email
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:12px 40px 28px;font-family:Arial,Helvetica,sans-serif;color:#6c7a92;font-size:15px;line-height:22px;">
              Confirm %EMAIL% to finish creating your MuuqWear account.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 32px 28px;">
              <a href="%LINK%" style="display:inline-block;background:#1E2A47;color:#ffffff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;padding:14px 28px;border-radius:4px;">Verify email</a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 40px 36px;font-family:Arial,Helvetica,sans-serif;color:#A9B7CC;font-size:12px;line-height:18px;">
              If the button does not work, copy this link:<br>
              <a href="%LINK%" style="color:#1E2A47;word-break:break-all;">%LINK%</a><br><br>
              If you did not create a MuuqWear account, you can ignore this email.
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-family:Arial,Helvetica,sans-serif;color:#A9B7CC;font-size:12px;">MuuqWear</p>
      </td>
    </tr>
  </table>
</body>
</html>
